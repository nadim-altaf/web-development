<!--  CSS Size Units
Absolute Units
px (Pixel):

Fixed size unit.

1 pixel on the screen.

Not relative to anything else.

Good for things that must be an exact size (e.g., borders).
---------------------------------------------------------
Relative Units
Font-Relative

em:

Relative to the font-size of the parent element.

2em means 2 times the parent's font size.

Can compound, leading to complex calculations if nested deeply.
---------------------------------------------------------
rem (Root em):

Relative to the font-size of the root element (the <html> tag).

Browser default is typically 16px, so 2rem is often 32px.

Does not compound.

Excellent for accessibility and scaling an entire site consistently.
---------------------------------------------------------
Viewport-Relative
vw (Viewport Width):

Relative to the browser window's width.

1vw = 1% of the viewport width.

100vw = the full width of the browser window.
---------------------------------------------------------
vh (Viewport Height):

Relative to the browser window's height.

1vh = 1% of the viewport height.

100vh = the full height of the browser window.
---------------------------------------------------------
Parent-Relative
% (Percentage):

Relative to the same property on the parent element.

Example: width: 50%; makes an element half the width of its parent container. -->
