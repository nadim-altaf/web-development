<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
        div{
            border: 2px black solid;
        }
        img{
            margin: 10px;
        }
        .img2{
            position: relative;
            top: 150px;
            left: 100px;
        }
        .img3{
            position: sticky;
            top: 100px;
        }
        .img4{
            position: fixed;
            
        }
        
        
        .container{
            position: relative;
            background-color: aquamarine;
            height: 1500px;
        }
        .box{
            background-color: cornflowerblue;
            height: 1500px;
        }
    </style>
  </head>
  <body>
    <div class="container">

    <img 
     src="download (1).jpeg"
     alt="image1" 
     width="300px" 
     height="300px" 
     class="img1"
     />

    <img src="download.jpeg" 
      alt="image2" 
      width="300px" 
      height="300px" 
      class="img2"
      />

    <img
      src="Prayer at night Infront of sea.jpeg"
      alt="image3"
      width="300px"
      height="300px"
      class="img3"
    />

    <img
      src="4f0b6696-5b45-4d56-b996-8729d330ba1e.jpeg"
      alt="image4"
      width="300px"
      height="300px"
      class="img4"
    />

    </div>

    <div class="box">

    </div>
  </body>
</html>
