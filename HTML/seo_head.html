<!-- 🌐 Important SEO Tags in HTML (Short Notes)
Tag Purpose / Use
    <title> ------Defines page title (shown in search results & browser tab)
    <meta name="description"> -------- Short page summary for search engines
    <meta name="keywords">--------- (Optional) List of important keywords
    <meta name="robots"> ------Controls if page should be indexed or not
    <meta charset="UTF-8"> ---------Sets character encoding
    <meta name="viewport"> ---------Makes site mobile-friendly (responsive)
    <h1> to <h6> ---------Headings – help search engines understand structure
    <img alt="text"> ---------Describes image for SEO and accessibility
    <a href="URL">--------- Adds links (important for SEO linking)
    <link rel="icon">--------- Adds favicon (small icon in browser tab)
    <meta property="og:...">--------- Open Graph tags – for better social media sharing -->
