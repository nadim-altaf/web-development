<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- The value of the for attribute in <label> must match the value of the id attribute in the <input>.

    This connection lets the user click the label to focus or activate the input field. -->
<body>
    <form>
        <label for="email">Enter your email:</label>
        <input type="text" id="email" placeholder="Enter your email here">
        <br>
        <br>
        <label for="password">Enter your password:</label>
        <input type="text" id="password">
        <br>
        <br>
        <input type="submit" value="Submit">
        <button style="color: aqua; background-color: black;">Click Here</button>

    </form>
</body>
</html>
