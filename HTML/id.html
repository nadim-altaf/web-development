<!DOCTYPE html>
<html>
<head>
  <style>
    /* Using id */
    #para1 {
      color: red;
      font-size: 20px;
    }
    #article1 {
      background: lightblue;
      padding: 10px;
    }
    #section1 {
      border: 2px solid black;
      padding: 10px;
    }

    /* Using class */
    .para {
      font-style: italic;
      color: green;
    }
    .cat {
      background: yellow;
      padding: 10px;
    }
    .loin.dog.cat {
      border: 2px dashed purple;
      padding: 10px;
    }
  </style>
</head>
<body>

  <p id="para1">This is paragraph with ID "para1"</p>
  <article id="article1">This is article with ID "article1"</article>
  <section id="section1">This is section with ID "section1"</section>

  <p class="para">This is paragraph with CLASS "para"</p>
  <article class="cat">This is article with CLASS "cat"</article>
  <section class="loin dog cat">This is section with CLASSES "loin dog cat"</section>

</body>
</html>
